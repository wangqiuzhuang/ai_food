server:
        port: 8080

spring:
# 数据库配置 + HikariCP连接池
        datasource:
                driver-class-name: com.mysql.cj.jdbc.Driver
                url: jdbc:mysql://localhost:3306/ai_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
                username: root
                password: admin123

# Redis
redis:
        host: localhost
        port: 6379
        database: 0
        timeout: 10000

# MyBatis
mybatis:
        mapper-locations: classpath:mapper/*.xml
        type-aliases-package: com.example.entity
        configuration:
                map-underscore-to-camel-case: true